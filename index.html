<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Quiz Materno</title>

  <!-- React -->
  <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>

  <!-- Babel -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <!-- Tailwind -->
  <script src="https://cdn.tailwindcss.com"></script>

  <!-- Lucide -->
  <script src="https://unpkg.com/lucide@latest"></script>
</head>

<body class="bg-slate-100">

  <div id="root"></div>

  <script type="text/babel">

    const { useState } = React;

    const QUESTIONS = [
      {
        id: 1,
        text: "Quando algo no comportamento do seu filho te chama atenção, qual costuma ser seu primeiro reflexo?",
        options: [
          { text: "Pesquisar ou tentar entender na hora", type: "atenta" },
          { text: "Observar mais um pouco antes de concluir qualquer coisa", type: "equilibrada" },
          { text: "Pensar “depois vejo isso com calma”", type: "sobrecarregada" },
          { text: "Acreditar que provavelmente é só uma fase normal", type: "tranquila" }
        ]
      },

      {
        id: 2,
        text: "Qual dessas frases mais combina com você?",
        options: [
          { text: "“Eu vivo observando se tá tudo certo com meu filho.”", type: "atenta" },
          { text: "“Gosto de entender as coisas sem paranoia.”", type: "equilibrada" },
          { text: "“Queria ter mais tempo pra acompanhar tudo.”", type: "sobrecarregada" },
          { text: "“Cada criança tem seu próprio tempo.”", type: "tranquila" }
        ]
      },

      {
        id: 3,
        text: "Quando uma mãe comenta algo sobre desenvolvimento, você:",
        options: [
          { text: "Fica pensando nisso depois", type: "atenta" },
          { text: "Reflete um pouco e segue tranquila", type: "equilibrada" },
          { text: "Sente culpa por não conseguir acompanhar tudo", type: "sobrecarregada" },
          { text: "Não compara muito", type: "tranquila" }
        ]
      },

      {
        id: 4,
        text: "Se um profissional dissesse: 'É só uma fase', você:",
        options: [
          { text: "Ainda ficaria com dúvida", type: "atenta" },
          { text: "Observaria mais um pouco", type: "equilibrada" },
          { text: "Aceitaria e seguiria a rotina", type: "sobrecarregada" },
          { text: "Ficaria tranquila", type: "tranquila" }
        ]
      }
    ];

    const RESULTS = {
      atenta: {
        title: "A Mãe Atenta",
        text: "Você percebe sinais antes da maioria e observa muitos detalhes."
      },

      equilibrada: {
        title: "A Mãe Equilibrada",
        text: "Você consegue unir calma, presença e observação."
      },

      sobrecarregada: {
        title: "A Mãe Sobrecarregada",
        text: "Você tenta dar conta de tudo ao mesmo tempo."
      },

      tranquila: {
        title: "A Mãe Tranquila",
        text: "Você acredita no tempo da criança e evita pressão excessiva."
      }
    };

    function App() {

      const [screen, setScreen] = useState("intro");
      const [questionIndex, setQuestionIndex] = useState(0);
      const [answers, setAnswers] = useState([]);
      const [result, setResult] = useState(null);

      const currentQuestion = QUESTIONS[questionIndex];

      function handleAnswer(type) {

        const updatedAnswers = [...answers, type];

        setAnswers(updatedAnswers);

        if (questionIndex < QUESTIONS.length - 1) {
          setQuestionIndex(questionIndex + 1);
        } else {
          calculateResult(updatedAnswers);
          setScreen("result");
        }
      }

      function calculateResult(finalAnswers) {

        const scores = {
          atenta: 0,
          equilibrada: 0,
          sobrecarregada: 0,
          tranquila: 0
        };

        finalAnswers.forEach(answer => {
          scores[answer]++;
        });

        let winner = "atenta";

        Object.keys(scores).forEach(key => {
          if (scores[key] > scores[winner]) {
            winner = key;
          }
        });

        setResult(winner);
      }

      if (screen === "intro") {

        return (
          <div className="min-h-screen flex items-center justify-center p-4">

            <div className="bg-white max-w-md w-full rounded-3xl shadow-xl p-8">

              <h1 className="text-3xl font-bold text-slate-800 mb-4">
                Que tipo de mãe você é?
              </h1>

              <p className="text-slate-600 mb-8">
                Descubra seu perfil no desenvolvimento do seu filho.
              </p>

              <button
                onClick={() => setScreen("quiz")}
                className="w-full bg-sky-600 hover:bg-sky-700 text-white py-4 rounded-2xl font-bold"
              >
                COMEÇAR O TESTE
              </button>

            </div>

          </div>
        );
      }

      if (screen === "quiz") {

        return (

          <div className="min-h-screen flex items-center justify-center p-4">

            <div className="max-w-2xl w-full">

              <div className="mb-6">

                <div className="w-full h-2 bg-slate-200 rounded-full">

                  <div
                    className="h-2 bg-sky-500 rounded-full"
                    style={{
                      width: `${((questionIndex + 1) / QUESTIONS.length) * 100}%`
                    }}
                  ></div>

                </div>

              </div>

              <div className="bg-white rounded-3xl shadow-xl p-8">

                <h2 className="text-2xl font-bold text-slate-800 mb-8">
                  {currentQuestion.text}
                </h2>

                <div className="space-y-4">

                  {currentQuestion.options.map((option, index) => (

                    <button
                      key={index}
                      onClick={() => handleAnswer(option.type)}
                      className="w-full text-left border border-slate-200 hover:border-sky-400 hover:bg-sky-50 rounded-2xl p-4 transition-all"
                    >
                      {option.text}
                    </button>

                  ))}

                </div>

              </div>

            </div>

          </div>

        );
      }

      const finalData = RESULTS[result];

      return (

        <div className="min-h-screen flex items-center justify-center p-4">

          <div className="bg-white max-w-2xl w-full rounded-3xl shadow-xl p-8">

            <div className="text-center mb-8">

              <div className="w-20 h-20 bg-sky-100 rounded-full flex items-center justify-center mx-auto mb-4">
                <span className="text-4xl">✓</span>
              </div>

              <h1 className="text-3xl font-bold text-slate-800">
                {finalData.title}
              </h1>

            </div>

            <p className="text-lg text-slate-600 leading-relaxed mb-8">
              {finalData.text}
            </p>

            <button className="w-full bg-sky-600 hover:bg-sky-700 text-white py-4 rounded-2xl font-bold">
              QUERO O MANUAL AGORA
            </button>

          </div>

        </div>

      );

    }

    ReactDOM.createRoot(document.getElementById("root")).render(<App />);

  </script>

</body>
</html>
